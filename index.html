<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mintify – Music for everyone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Log in / Sign up -->
  <section id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="logo"><span class="logo-dot"></span>Mintify</div>
      <h1 id="authTitle">Log in to continue</h1>
      <form id="authForm">
        <input id="username" placeholder="Username or email" autocomplete="username" required>
        <input id="email" type="email" placeholder="Email" autocomplete="email" class="hidden">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <select id="role" class="hidden">
          <option value="user">User</option>
          <option value="artist">Artist</option>
        </select>
        <button class="btn primary" id="authBtn">Log in</button>
      </form>
      <p class="error" id="authError"></p>
      <p class="switch"><span id="switchText">New here?</span> <a id="switchLink">Sign up</a></p>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="logo"><span class="logo-dot"></span>Mintify</div>
      <nav>
        <a data-view="home" class="active">Home</a>
        <a data-view="albums">Albums</a>
        <a data-view="studio" id="studioLink" class="hidden">Artist studio</a>
      </nav>
      <div class="profile">
        <div class="avatar" id="avatar"></div>
        <div class="who"><b id="uname"></b><small id="urole"></small></div>
        <button id="logout" class="icon-btn" title="Log out" aria-label="Log out">Log out</button>
      </div>
    </aside>

    <main id="main">
      <div class="topbar"><input id="search" type="search" placeholder="Search songs or artists"></div>
      <div id="view"></div>
    </main>

    <footer class="player">
      <div class="now">
        <div class="cover small" id="pCover"></div>
        <div><b id="pTitle">Nothing playing</b><small id="pArtist">Pick a song to start</small></div>
      </div>
      <div class="controls">
        <div class="btns">
          <button id="prev" aria-label="Previous">⏮</button>
          <button id="play" class="play" aria-label="Play or pause">▶</button>
          <button id="next" aria-label="Next">⏭</button>
        </div>
        <div class="seekrow">
          <small id="cur">0:00</small>
          <input id="seek" type="range" min="0" max="1000" value="0">
          <small id="dur">0:00</small>
        </div>
      </div>
      <div class="volume"><small>Vol</small><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></div>
      <audio id="audio"></audio>
    </footer>
  </div>

  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
